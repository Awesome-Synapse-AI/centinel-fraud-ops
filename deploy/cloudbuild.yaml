steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/fraud-images/app:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/fraud-images/app:$SHORT_SHA
  - name: gcr.io/cloud-builders/kubectl
    args:
      - apply
      - -f
      - deploy/k8s
    env:
      - CLOUDSDK_COMPUTE_ZONE=us-central1-a
      - CLOUDSDK_CONTAINER_CLUSTER=fraud-cluster
  - name: gcr.io/cloud-builders/kubectl
    args:
      - set
      - image
      - deployment/fraud-scorer
      - scorer=us-central1-docker.pkg.dev/$PROJECT_ID/fraud-images/app:$SHORT_SHA
    env:
      - CLOUDSDK_COMPUTE_ZONE=us-central1-a
      - CLOUDSDK_CONTAINER_CLUSTER=fraud-cluster
